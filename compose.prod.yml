# ─────────────────────────────────────────────────────────────
# Production stack (deployed on VPS)
# Pulls images from GHCR. Traefik handles HTTPS via Let's Encrypt.
#
# Required .env on VPS:
#   DOMAIN, ACME_EMAIL, GHCR_OWNER, IMAGE_TAG,
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL
# ─────────────────────────────────────────────────────────────
name: portfolio

networks:
  edge:
    name: edge
  internal:
    name: internal
    internal: true

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/letsencrypt:/letsencrypt
    networks:
      - edge

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER}/portfolio-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: 4000
      CORS_ORIGIN: https://${DOMAIN}
    networks:
      - edge
      - internal

  web:
    image: ghcr.io/${GHCR_OWNER}/portfolio-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    networks:
      - edge

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      GRAFANA_REMOTE_WRITE_URL: ${GRAFANA_REMOTE_WRITE_URL}
      GRAFANA_USERNAME: ${GRAFANA_USERNAME}
      GRAFANA_API_TOKEN: ${GRAFANA_API_TOKEN}
    depends_on:
      - api
    networks:
      - internal

volumes:
  db_data:
